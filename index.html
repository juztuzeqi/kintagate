<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Gate KP2A</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--green:#22c55e;--orange:#f59e0b;--red:#ef4444;--border:#334155}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:16px;padding-bottom:60px;max-width:560px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--border);padding:8px 14px;border-radius:20px;font-size:13px}
.chip b{color:var(--green)}
.chip.pulang b{color:var(--orange)}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);padding:14px;border-radius:12px;font-size:16px;outline:none}
.search input:focus{border-color:var(--green)}
.search button{background:var(--green);border:none;color:#000;padding:0 20px;border-radius:12px;font-size:22px;cursor:pointer}
.suggest{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:12px;display:none;max-height:280px;overflow-y:auto}
.suggest div{padding:14px;border-bottom:1px solid var(--border);cursor:pointer;font-size:15px}
.suggest div:hover{background:#334155}
.kartu{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px}
.kartu .nama{font-size:22px;font-weight:600;margin-bottom:4px}
.kartu .id{color:var(--muted);font-size:12px;font-family:monospace;margin-bottom:14px}
.status{display:flex;gap:10px;margin-bottom:14px;font-size:15px}
.status span{flex:1;background:#0f172a;padding:10px;border-radius:10px;text-align:center}
.status b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:500;margin-bottom:2px}
.aksi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aksi button{padding:20px;border:none;border-radius:14px;font-size:17px;font-weight:600;cursor:pointer;color:#000;transition:transform .1s}
.btn-datang{background:var(--green)}
.btn-pulang{background:var(--orange)}
.aksi button:disabled{opacity:.35;cursor:not-allowed}
.aksi button:not(:disabled):active{transform:scale(.96)}
.hari{background:var(--card);border-radius:12px;padding:14px}
.hari h3{margin:0 0 10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;gap:8px}
.row:last-child{border:none}
.row .w{font-family:monospace;color:var(--muted);font-size:13px;white-space:nowrap}
.row .w .out{color:var(--orange)}
.err{background:#7f1d1d;color:#fff;padding:12px;border-radius:10px;margin-bottom:12px;font-size:13px;display:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;padding:12px 20px;border-radius:24px;border:1px solid var(--border);font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:100}
.toast.show{opacity:1}
#qr{position:fixed;inset:0;background:#000;display:none;z-index:50;flex-direction:column;justify-content:center}
#qr .close{position:absolute;top:20px;right:20px;background:var(--red);border:none;color:#fff;padding:12px 18px;border-radius:10px;font-size:16px;cursor:pointer}
#qrreader{width:100%}
</style>
</head>
<body>

<h1>🚪 Gate KP2A</h1>
<div class="sub" id="tanggal">Memuat…</div>

<div class="chips">
  <div class="chip">Datang: <b id="cDatang">0</b></div>
  <div class="chip pulang">Pulang: <b id="cPulang">0</b></div>
</div>

<div class="err" id="err"></div>

<div class="search">
  <input id="cari" placeholder="Scan QR atau ketik nama / kode…" autocomplete="off" autofocus>
  <button id="btnScan" title="Scan QR">📷</button>
</div>
<div class="suggest" id="suggest"></div>

<div id="panel"></div>

<div class="hari">
  <h3>Aktivitas Hari Ini</h3>
  <div id="daftar"><div style="color:var(--muted);font-size:13px">Belum ada aktivitas.</div></div>
</div>

<div class="toast" id="toast"></div>

<div id="qr">
  <button class="close" onclick="tutupQR()">✕</button>
  <div id="qrreader"></div>
</div>

<script>
const SUPABASE_URL = 'https://yjdumalkhkjujcflecmc.supabase.co';   // ← isi
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqZHVtYWxraGtqdWpjZmxlY21jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxNDE0NzMsImV4cCI6MjExMDcxNzQ3M30.Zr8V71wh2-juFeDh6D549qlTooTcb3rO118rCYriww0';                     // ← anon JWT legacy, bukan sb_publishable_
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TZ = 'Asia/Makassar';
const tglHariIni = () => new Date().toLocaleDateString('en-CA', { timeZone: TZ });

let siswaList = [];
let hariIni = {};
let terpilih = null;

const $ = id => document.getElementById(id);
const toast = msg => { const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); };
const showErr = m => { const e=$('err'); e.textContent='⚠️ '+m; e.style.display='block'; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display='none',6000); };

const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString('id-ID',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}) : '—';

async function muatSiswa() {
  const { data, error } = await sb.from('students').select('id,nama').order('nama');
  if (error) { showErr('Gagal muat siswa: ' + error.message); return; }
  siswaList = data || [];
}

async function muatHariIni() {
  const { data, error } = await sb.from('gate').select('*').eq('tanggal', tglHariIni());
  if (error) { showErr(error.message); return; }
  hariIni = {};
  (data || []).forEach(r => hariIni[r.student_id] = r);
  renderDaftar();
}

function renderDaftar() {
  const rows = Object.values(hariIni).sort((a,b)=>(b.datang_at||'').localeCompare(a.datang_at||''));
  $('cDatang').textContent = rows.filter(r=>r.datang_at).length;
  $('cPulang').textContent = rows.filter(r=>r.pulang_at).length;
  const d = $('daftar');
  if (!rows.length) { d.innerHTML='<div style="color:var(--muted);font-size:13px">Belum ada aktivitas.</div>'; return; }
  d.innerHTML = rows.map(r => `
    <div class="row">
      <span>${r.nama}</span>
      <span class="w">${fmtTime(r.datang_at)} → <span class="out">${fmtTime(r.pulang_at)}</span></span>
    </div>`).join('');
}

function cariSiswa(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  return siswaList.filter(s => s.nama.toLowerCase().includes(q) || String(s.id).toLowerCase().includes(q)).slice(0, 8);
}

function renderSuggest() {
  const hasil = cariSiswa($('cari').value);
  const box = $('suggest');
  if (!hasil.length) { box.style.display='none'; return; }
  box.innerHTML = hasil.map(s => `<div data-id="${s.id}">${s.nama} <span style="color:var(--muted);font-size:12px">· ${s.id}</span></div>`).join('');
  box.querySelectorAll('div').forEach(el => el.onclick = () => pilihSiswa(el.dataset.id));
  box.style.display = 'block';
}

function pilihSiswa(id) {
  terpilih = siswaList.find(s => String(s.id) === String(id));
  $('cari').value = '';
  $('suggest').style.display = 'none';
  $('cari').blur();
  renderKartu();
}

function renderKartu() {
  if (!terpilih) { $('panel').innerHTML=''; return; }
  const r = hariIni[terpilih.id] || {};
  $('panel').innerHTML = `
    <div class="kartu">
      <div class="nama">${terpilih.nama}</div>
      <div class="id">${terpilih.id}</div>
      <div class="status">
        <span><b>Datang</b>${fmtTime(r.datang_at)}</span>
        <span><b>Pulang</b>${fmtTime(r.pulang_at)}</span>
      </div>
      <div class="aksi">
        <button class="btn-datang" ${r.datang_at?'disabled':''} onclick="catat('datang')">✅ Datang</button>
        <button class="btn-pulang" ${(!r.datang_at||r.pulang_at)?'disabled':''} onclick="catat('pulang')">🏠 Pulang</button>
      </div>
    </div>`;
}

async function catat(tipe) {
  if (!terpilih) return;
  const nowIso = new Date().toISOString();
  const r = hariIni[terpilih.id] || {};
  const row = {
    student_id: terpilih.id,
    nama: terpilih.nama,
    tanggal: tglHariIni(),
    datang_at: r.datang_at || null,
    pulang_at: r.pulang_at || null,
    updated_at: nowIso
  };
  if (tipe === 'datang') row.datang_at = nowIso;
  else row.pulang_at = nowIso;

  const { error } = await sb.from('gate').upsert(row, { onConflict: 'student_id,tanggal' });
  if (error) { showErr(error.message); return; }
  await muatHariIni();
  renderKartu();
  toast(tipe==='datang' ? '✅ '+terpilih.nama+' datang' : '🏠 '+terpilih.nama+' pulang');
}

// ── Scan QR ──
let qrScanner = null;
async function bukaQR() {
  $('qr').style.display = 'flex';
  try {
    qrScanner = new Html5Qrcode('qrreader');
    await qrScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 260, height: 260 } },
      text => {
        tutupQR();
        const id = String(text).trim();
        const s = siswaList.find(x => String(x.id) === id);
        if (s) pilihSiswa(id);
        else { $('cari').value = id; renderSuggest(); toast('Kode tidak dikenal: '+id); }
      },
      () => {}
    );
  } catch (e) { showErr('Kamera: '+e.message); tutupQR(); }
}
async function tutupQR() {
  $('qr').style.display = 'none';
  if (qrScanner) { try { await qrScanner.stop(); await qrScanner.clear(); } catch(_){} qrScanner = null; }
}

// ── Init ──
async function init() {
  $('tanggal').textContent = new Date().toLocaleDateString('id-ID',
    { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  await muatSiswa();
  await muatHariIni();

  sb.channel('gate-rt')
    .on('postgres_changes', { event:'*', schema:'public', table:'gate' }, () => {
      muatHariIni().then(() => { if (terpilih) renderKartu(); });
    })
    .subscribe();

  $('cari').addEventListener('input', renderSuggest);
  $('cari').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const hasil = cariSiswa($('cari').value);
      if (hasil.length === 1) pilihSiswa(hasil[0].id);
      else if (hasil.length > 1) renderSuggest();
    }
  });
  $('btnScan').onclick = bukaQR;
}
init();
</script>
</body>
</html>
